@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--ink:#18251e;--muted:#748078;--line:#e6eae5;--paper:#fff;--canvas:#f6f7f4;--green:#1b7655;--green2:#e8f4ed;--lime:#d8f27b;--red:#b44d45;--amber:#af7622;--shadow:0 12px 35px #1c30230d;--radius:17px}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:244px 1fr}.sidebar{background:#fff;border-right:1px solid var(--line);padding:25px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:11px;padding:1px 11px 30px}.brand-mark{height:34px;width:34px;border-radius:12px;background:var(--green);display:grid;place-items:center;color:#fff;font:800 18px Manrope}.brand strong{font:800 17px Manrope;letter-spacing:-.5px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:1px}.nav-label{color:#a0aaa3;text-transform:uppercase;font-size:10px;letter-spacing:1px;font-weight:700;padding:12px 12px 7px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#637067;text-align:left;padding:11px 12px;border-radius:10px;font-weight:600;display:flex;align-items:center;gap:12px}.nav button:hover{background:#f5f7f4;color:var(--ink)}.nav button.active{background:var(--green2);color:var(--green)}.nav .ico{width:18px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:16px 10px 0;color:var(--muted);font-size:11px;line-height:1.55}.profile{display:flex;align-items:center;gap:10px;margin-bottom:10px;color:var(--ink);font-weight:700}.avatar{height:32px;width:32px;border-radius:50%;background:var(--lime);display:grid;place-items:center;color:#38501c;font-weight:800}.main{min-width:0}.topbar{height:74px;border-bottom:1px solid var(--line);background:#ffffffbd;display:flex;align-items:center;justify-content:space-between;padding:0 38px;position:sticky;top:0;z-index:4;backdrop-filter:blur(12px)}.page-title{font:800 19px Manrope;letter-spacing:-.4px}.top-right{display:flex;align-items:center;gap:14px}.date-chip{border:1px solid var(--line);background:white;border-radius:9px;padding:8px 11px;color:#59665d;font-size:12px}.content{max-width:1380px;margin:auto;padding:31px 38px 60px}.welcome{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:25px}.welcome h1{font:800 26px Manrope;letter-spacing:-.9px;margin:0 0 5px}.welcome p{color:var(--muted);margin:0}.actions{display:flex;gap:9px}.btn{border:1px solid var(--line);border-radius:10px;background:white;padding:10px 14px;font-weight:700;color:var(--ink);box-shadow:0 2px 3px #18251e06}.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.primary:hover{background:#155f44}.btn.subtle{background:var(--green2);border-color:var(--green2);color:var(--green)}.btn.danger{color:var(--red)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.metric{padding:19px 20px}.metric-head{display:flex;justify-content:space-between;color:var(--muted);font-weight:600;font-size:12px}.metric-icon{background:#f4f6f2;border-radius:9px;height:30px;width:30px;display:grid;place-items:center;font-size:15px}.metric-value{font:800 25px Manrope;letter-spacing:-.7px;margin:16px 0 5px}.metric-foot{font-size:11px;color:var(--muted)}.positive{color:var(--green)}.negative{color:var(--red)}.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-bottom:16px}.panel{padding:21px 22px}.panel-heading{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:19px}.business-switch{max-width:190px}.panel-heading h2{margin:0;font:800 15px Manrope;letter-spacing:-.2px}.panel-heading p{margin:5px 0 0;color:var(--muted);font-size:11px}.text-btn{border:0;background:none;color:var(--green);font-weight:700;font-size:12px}.chart{height:205px;position:relative;padding:5px 0 20px 35px}.chart svg{height:100%;width:100%;overflow:visible}.chart .gridline{stroke:#edf0ec;stroke-width:1}.chart-labels{position:absolute;inset:0 auto 13px 0;display:flex;flex-direction:column;justify-content:space-between;color:#9aa39d;font-size:10px}.xlabels{display:flex;justify-content:space-between;color:#9aa39d;font-size:10px;margin-left:35px}.legend{display:flex;gap:14px;margin-top:12px;color:var(--muted);font-size:10px}.legend span{display:flex;align-items:center;gap:5px}.dot{height:7px;width:7px;border-radius:50%;background:var(--green)}.dot.lime{background:#c7df6c}.activity{display:grid;gap:14px}.activity-row{display:flex;align-items:center;gap:11px}.activity-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:#f0f5ef}.activity-info{flex:1;min-width:0}.activity-info b{display:block;font-size:12px}.activity-info span{color:var(--muted);font-size:10px}.activity-amount{font-size:12px;font-weight:700}.status{font-size:10px;padding:4px 8px;border-radius:20px;background:var(--green2);color:var(--green);font-weight:700}.status.warn{background:#fff4e2;color:var(--amber)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;white-space:nowrap}.table th{text-align:left;color:#87928a;font-size:10px;letter-spacing:.5px;text-transform:uppercase;padding:0 12px 12px;font-weight:700}.table td{border-top:1px solid #f0f2ef;padding:13px 12px;font-size:12px}.table td:first-child,.table th:first-child{padding-left:0}.table td:last-child,.table th:last-child{padding-right:0}.table strong{font-size:12px}.empty{text-align:center;padding:35px;color:var(--muted);font-size:12px}.section-title{margin:0 0 19px;font:800 22px Manrope;letter-spacing:-.6px}.section-sub{color:var(--muted);margin:-12px 0 22px}.toolbar{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}.search{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 12px;width:min(300px,100%);outline:0}.search:focus,input:focus,select:focus,textarea:focus{border-color:#8fb9a3!important;box-shadow:0 0 0 3px #1b765513}.filters{display:flex;gap:8px}.filter{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px;color:#617067;font-size:12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#657168;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:white;border-radius:9px;padding:10px 11px;outline:0;color:var(--ink)}.field textarea{min-height:70px;resize:vertical}.modal-back{position:fixed;inset:0;z-index:10;background:#17231dc9;display:grid;place-items:center;padding:16px}.modal{background:var(--canvas);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:18px;box-shadow:0 30px 100px #0003}.modal-head{padding:20px 23px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-head h2{font:800 17px Manrope;margin:0}.close{border:0;background:#eaeee9;border-radius:8px;width:30px;height:30px;font-size:18px}.modal-body{padding:22px 23px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:18px}.toast{position:fixed;bottom:20px;right:23px;z-index:20;background:#20342a;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:12px;animation:fade 3s forwards}@keyframes fade{0%,75%{opacity:1}100%{opacity:0;pointer-events:none}}.stock-low{color:var(--red);font-weight:700}.report-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.report-tile{padding:17px 18px;background:#f8faf7;border-radius:12px}.report-tile span{font-size:11px;color:var(--muted)}.report-tile b{display:block;font:800 20px Manrope;margin-top:9px}.notice{background:#f2f6ee;border:1px solid #e2ebdb;padding:14px 16px;border-radius:12px;color:#586650;font-size:11px;line-height:1.5}.products-list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.product{background:white;border:1px solid var(--line);border-radius:13px;padding:15px}.product-top{display:flex;justify-content:space-between;align-items:center}.product-icon{height:35px;width:35px;border-radius:10px;display:grid;place-items:center;background:#eff5eb;font-size:17px}.product h3{font-size:13px;margin:13px 0 4px}.product .sku{font-size:10px;color:var(--muted)}.product-bottom{margin-top:13px;padding-top:11px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:11px}.settings-row{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--line);gap:20px}.settings-row:last-child{border:0}.settings-row b{font-size:12px}.settings-row p{font-size:10px;color:var(--muted);margin:4px 0 0}.settings-row input{max-width:210px;border:1px solid var(--line);padding:9px;border-radius:8px}.mobile-menu{display:none}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.products-list{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{position:fixed;height:100vh;width:244px;z-index:8;left:-260px;transition:.2s;box-shadow:var(--shadow)}.sidebar.open{left:0}.mobile-menu{display:grid;place-items:center;border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;margin-right:10px}.topbar{padding:0 17px;height:62px}.page-title{font-size:16px}.top-right .date-chip{display:none}.content{padding:24px 16px 45px}.welcome{align-items:flex-start;gap:15px;flex-direction:column}.welcome h1{font-size:23px}.cards{gap:9px}.metric{padding:15px}.metric-value{font-size:20px}.metric-head{font-size:10px}.metric-icon{height:25px;width:25px}.panel{padding:17px 15px}.products-list{grid-template-columns:1fr 1fr}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.report-cards{grid-template-columns:1fr}.settings-row{align-items:flex-start;flex-direction:column}.settings-row input{max-width:100%;width:100%}}

<body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">L</div><div><strong>ledgerleaf</strong><small>Small business books</small></div></div><div class="nav-label">Workspace</div><nav class="nav" id="nav"></nav><div class="side-bottom"><div class="profile"><div class="avatar">B</div><div id="profileName">Your business</div></div><div>Private to this browser<br>Last saved just now</div></div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center"><button class="mobile-menu" onclick="toggleMenu()">☰</button><div class="page-title" id="topTitle">Overview</div></div><div class="top-right"><span class="date-chip" id="today"></span><select id="businessSwitcher" class="filter business-switch" aria-label="Choose business" onchange="switchBusiness(this.value)"></select><button class="btn primary" onclick="openInvoice()">＋ New invoice</button></div></header><div class="content" id="content"></div></main></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const defaults={business:'',currency:'INR',taxRate:0,products:[],customers:[],invoices:[],expenses:[]};let data,businesses=[],activeBusinessId='';try{const savedBusinesses=JSON.parse(localStorage.getItem('ledgerleaf.businesses'));if(Array.isArray(savedBusinesses)&&savedBusinesses.length){businesses=savedBusinesses;activeBusinessId=localStorage.getItem('ledgerleaf.activeBusiness')||businesses[0].id;data=businesses.find(b=>b.id===activeBusinessId)||businesses[0];activeBusinessId=data.id}else{data=JSON.parse(localStorage.getItem('ledgerleaf.data'))||defaults;if(Array.isArray(data.expenses))data.expenses=data.expenses.filter(e=>!['EXP-1001','EXP-1002'].includes(e.id));data={...data,id:'business-'+Date.now()};businesses=[data];activeBusinessId=data.id}}catch(e){data={...defaults,id:'business-'+Date.now()};businesses=[data];activeBusinessId=data.id}if(!localStorage.getItem('ledgerleaf.zeroed-v1')){for(const b of businesses){b.invoices=[];b.expenses=[]}localStorage.setItem('ledgerleaf.zeroed-v1','1')}if(!localStorage.getItem('ledgerleaf.empty-v2')){for(const b of businesses){if(b.business==='My Business')b.business='';b.products=(b.products||[]).filter(p=>!['p1','p2','p3'].includes(p.id));b.customers=(b.customers||[]).filter(c=>!['Ananya Rao','Northstar Studio'].includes(c.name))}localStorage.setItem('ledgerleaf.empty-v2','1')}let view='Overview';const navItems=[['Overview','◫'],['Invoices','▤'],['Inventory','▦'],['Expenses','↗'],['Reports','▥'],['Settings','⚙']];const fmt=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:data.currency||'INR',maximumFractionDigits:0}).format(Number(n)||0);const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){const i=businesses.findIndex(b=>b.id===data.id);if(i<0)businesses.push(data);else businesses[i]=data;localStorage.setItem('ledgerleaf.businesses',JSON.stringify(businesses));localStorage.setItem('ledgerleaf.activeBusiness',activeBusinessId);document.getElementById('profileName').textContent=data.business||'Your business';drawBusinessSwitcher()}function drawBusinessSwitcher(){const el=document.getElementById('businessSwitcher');if(el)el.innerHTML=businesses.map(b=>`<option value="${escapeHTML(b.id)}" ${b.id===activeBusinessId?'selected':''}>${escapeHTML(b.business||'Your business')}</option>`).join('')}function switchBusiness(id){const next=businesses.find(b=>b.id===id);if(!next)return;data=next;activeBusinessId=id;localStorage.setItem('ledgerleaf.activeBusiness',id);document.getElementById('profileName').textContent=data.business||'Your business';drawBusinessSwitcher();render()}function addBusiness(){const name=prompt('Enter the new business name:');if(!name||!name.trim())return;const b={id:'business-'+Date.now(),business:name.trim(),currency:'INR',taxRate:0,products:[],customers:[],invoices:[],expenses:[]};businesses.push(b);data=b;activeBusinessId=b.id;view='Overview';save();drawNav();document.getElementById('topTitle').textContent=view;render();toast('Business added.')}function today(){return new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}document.getElementById('today').textContent=today();function drawNav(){document.getElementById('nav').innerHTML=navItems.map(([n,i])=>`<button class="${n===view?'active':''}" onclick="go('${n}')"><span class="ico">${i}</span>${n}</button>`).join('')}function go(v){view=v;drawNav();document.getElementById('topTitle').textContent=v;document.getElementById('sidebar').classList.remove('open');render()}function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}function toast(m){document.getElementById('toastRoot').innerHTML=`<div class="toast">${escapeHTML(m)}</div>`;setTimeout(()=>document.getElementById('toastRoot').innerHTML='',3000)}function monthInvoices(){const now=new Date();return data.invoices.filter(i=>{const d=new Date(i.date+'T00:00:00');return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()})}function monthExpenses(){const now=new Date();return data.expenses.filter(i=>{const d=new Date(i.date+'T00:00:00');return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()})}function sum(arr,key){return arr.reduce((s,x)=>s+(Number(x[key])||0),0)}function render(){const c=document.getElementById('content');if(view==='Overview')c.innerHTML=dashboard();if(view==='Invoices')c.innerHTML=invoicesPage();if(view==='Inventory')c.innerHTML=inventoryPage();if(view==='Expenses')c.innerHTML=expensesPage();if(view==='Reports')c.innerHTML=reportsPage();if(view==='Settings')c.innerHTML=settingsPage()}
function dashboard(){const inv=monthInvoices(),exp=monthExpenses(),sales=sum(inv,'total'),cost=inv.reduce((s,i)=>s+i.items.reduce((a,x)=>a+(x.cost*x.qty),0),0),net=sales-cost-sum(exp,'amount'),due=sum(data.invoices.filter(i=>i.status==='Unpaid'),'total'),low=data.products.filter(p=>p.stock<10).length;return `<div class="welcome"><div><h1>Good ${new Date().getHours()<12?'morning':new Date().getHours()<17?'afternoon':'evening'} 👋</h1><p>Here’s how your business is doing this month.</p></div><div class="actions"><button class="btn" onclick="openExpense()">＋ Add expense</button><button class="btn primary" onclick="openInvoice()">＋ Create invoice</button></div></div><div class="cards"><div class="card metric"><div class="metric-head">Sales this month <span class="metric-icon">↗</span></div><div class="metric-value">${fmt(sales)}</div><div class="metric-foot">${inv.length} invoice${inv.length===1?'':'s'} recorded</div></div><div class="card metric"><div class="metric-head">Expenses this month <span class="metric-icon">↘</span></div><div class="metric-value">${fmt(sum(exp,'amount'))}</div><div class="metric-foot">${exp.length} expense${exp.length===1?'':'s'} recorded</div></div><div class="card metric"><div class="metric-head">Estimated net <span class="metric-icon">◈</span></div><div class="metric-value">${fmt(net)}</div><div class="metric-foot">Sales less item cost and expenses</div></div><div class="card metric"><div class="metric-head">Invoices due <span class="metric-icon">◷</span></div><div class="metric-value">${fmt(due)}</div><div class="metric-foot">${data.invoices.filter(i=>i.status==='Unpaid').length} unpaid invoice${data.invoices.filter(i=>i.status==='Unpaid').length===1?'':'s'} · ${low} low stock</div></div></div><div class="grid2"><section class="panel"><div class="panel-heading"><div><h2>Business at a glance</h2><p>Your recent sales and expenses</p></div><button class="text-btn" onclick="go('Reports')">View report →</button></div>${chart()}</section><section class="panel"><div class="panel-heading"><div><h2>Recent activity</h2><p>Latest in your books</p></div></div><div class="activity">${recentActivity()}</div></section></div><section class="panel"><div class="panel-heading"><div><h2>Latest invoices</h2><p>Keep track of customer payments</p></div><button class="text-btn" onclick="go('Invoices')">All invoices →</button></div>${invoiceTable(data.invoices.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5))}</section>`}
function chart(){let months=[];for(let j=5;j>=0;j--){const d=new Date();d.setMonth(d.getMonth()-j);const m=d.getMonth(),y=d.getFullYear();months.push({label:d.toLocaleDateString('en-IN',{month:'short'}),sales:sum(data.invoices.filter(i=>{let x=new Date(i.date+'T00:00:00');return x.getMonth()===m&&x.getFullYear()===y}),'total'),expenses:sum(data.expenses.filter(i=>{let x=new Date(i.date+'T00:00:00');return x.getMonth()===m&&x.getFullYear()===y}),'amount')})}const max=Math.max(1,...months.flatMap(m=>[m.sales,m.expenses])),pts=(key)=>months.map((m,i)=>`${i*100/(months.length-1)},${100-(m[key]/max*90)}`).join(' ');return `<div class="chart"><div class="chart-labels"><span>${fmt(max)}</span><span>${fmt(max*.5)}</span><span>₹0</span></div><svg viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="0" y1="5" x2="100" y2="5" class="gridline"/><line x1="0" y1="50" x2="100" y2="50" class="gridline"/><line x1="0" y1="95" x2="100" y2="95" class="gridline"/><polyline points="${pts('sales')}" fill="none" stroke="#1b7655" stroke-width="2.2" vector-effect="non-scaling-stroke"/><polyline points="${pts('expenses')}" fill="none" stroke="#c7df6c" stroke-width="2.2" vector-effect="non-scaling-stroke"/></svg></div><div class="xlabels">${months.map(m=>`<span>${m.label}</span>`).join('')}</div><div class="legend"><span><i class="dot"></i>Sales</span><span><i class="dot lime"></i>Expenses</span></div>`}function recentActivity(){const list=[...data.invoices.map(i=>({date:i.date,type:'invoice',label:i.customer||'Customer',amount:i.total,status:i.status})),...data.expenses.map(e=>({date:e.date,type:'expense',label:e.description||e.category,amount:e.amount,status:'Recorded'}))].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);return list.length?list.map(x=>`<div class="activity-row"><div class="activity-icon">${x.type==='invoice'?'▤':'↘'}</div><div class="activity-info"><b>${escapeHTML(x.label)}</b><span>${x.type==='invoice'?'Invoice':'Expense'} · ${new Date(x.date+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</span></div><div class="activity-amount ${x.type==='expense'?'negative':'positive'}">${x.type==='expense'?'−':'+'}${fmt(x.amount)}</div></div>`).join(''):'<div class="empty">Your activity will appear here.</div>'}
function invoiceTable(items){return items.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>${items.map(i=>`<tr><td><strong>${escapeHTML(i.id)}</strong></td><td>${escapeHTML(i.customer)}</td><td>${new Date(i.date+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</td><td><strong>${fmt(i.total)}</strong></td><td><span class="status ${i.status==='Unpaid'?'warn':''}">${escapeHTML(i.status)}</span></td><td><button class="text-btn" onclick="togglePaid('${i.id}')">${i.status==='Paid'?'✓':'Mark paid'}</button> <button class="text-btn" onclick="printInvoice('${escapeHTML(i.id)}')">Print</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No invoices yet. Create your first invoice to get started.</div>'}
function printInvoice(id){const i=data.invoices.find(x=>x.id===id);if(!i)return;const w=window.open('','_blank','width=850,height=700');if(!w){toast('Allow pop-ups to print this invoice.');return}const lines=i.items.map(x=>`<tr><td>${escapeHTML(x.name)}</td><td>${x.qty}</td><td>${fmt(x.price)}</td><td>${fmt(x.qty*x.price)}</td></tr>`).join('');w.document.write(`<!doctype html><html><head><title>${escapeHTML(i.id)}</title><meta charset="utf-8"><style>body{font:14px Arial,sans-serif;color:#17231d;margin:40px}header{display:flex;justify-content:space-between;border-bottom:2px solid #1b7655;padding-bottom:20px}h1{font-size:24px;margin:0 0 5px}.muted{color:#68756c;font-size:12px}.details{margin:28px 0;display:flex;justify-content:space-between}table{width:100%;border-collapse:collapse;margin-top:24px}th,td{text-align:left;padding:12px;border-bottom:1px solid #ddd}th{font-size:11px;text-transform:uppercase;color:#68756c}.totals{margin:22px 0 0 auto;width:260px}.totals div{display:flex;justify-content:space-between;padding:6px 0}.grand{font-weight:bold;font-size:17px;border-top:2px solid #1b7655;margin-top:6px;padding-top:12px!important}.note{margin-top:30px}.print{position:fixed;top:20px;right:20px;background:#1b7655;color:white;border:0;padding:10px 14px;border-radius:7px}@media print{body{margin:12mm}.print{display:none}}</style></head><body><button class="print" onclick="window.print()">Print invoice</button><header><div><h1>${escapeHTML(data.business||'Your business')}</h1><div class="muted">Business invoice</div></div><div style="text-align:right"><h1>INVOICE</h1><div><b>${escapeHTML(i.id)}</b></div><div class="muted">${new Date(i.date+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</div></div></header><div class="details"><div><div class="muted">BILL TO</div><b>${escapeHTML(i.customer)}</b></div><div><div class="muted">PAYMENT STATUS</div><b>${escapeHTML(i.status)}</b></div></div><table><thead><tr><th>Item</th><th>Qty</th><th>Unit price</th><th>Amount</th></tr></thead><tbody>${lines}</tbody></table><div class="totals"><div><span>Subtotal</span><span>${fmt(i.subtotal)}</span></div><div><span>Tax</span><span>${fmt(i.tax)}</span></div><div class="grand"><span>Total</span><span>${fmt(i.total)}</span></div></div>${i.notes?`<div class="note"><b>Notes</b><p>${escapeHTML(i.notes)}</p></div>`:''}</body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),350)}function invoicesPage(){return `<h1 class="section-title">Invoices</h1><p class="section-sub">Create customer invoices and track what’s been paid.</p><div class="toolbar"><input class="search" id="invSearch" placeholder="Search invoices or customers…" oninput="filterInvoices()"><button class="btn primary" onclick="openInvoice()">＋ New invoice</button></div><section class="panel" id="invoiceTable">${invoiceTable(data.invoices.slice().sort((a,b)=>b.date.localeCompare(a.date)))}</section>`}function filterInvoices(){const q=document.getElementById('invSearch').value.toLowerCase();const items=data.invoices.filter(i=>i.id.toLowerCase().includes(q)||i.customer.toLowerCase().includes(q));document.getElementById('invoiceTable').innerHTML=invoiceTable(items)}function togglePaid(id){const i=data.invoices.find(x=>x.id===id);if(i){i.status=i.status==='Paid'?'Unpaid':'Paid';save();render();toast(`Invoice ${id} marked ${i.status.toLowerCase()}.`)}}
function inventoryPage(){return `<h1 class="section-title">Inventory</h1><p class="section-sub">Your products, prices, and available stock.</p><div class="toolbar"><input class="search" id="prodSearch" placeholder="Search products…" oninput="filterProducts()"><button class="btn primary" onclick="openProduct()">＋ Add product</button></div><div class="products-list" id="productList">${productsCards(data.products)}</div>`}function productsCards(products){return products.length?products.map(p=>`<article class="product"><div class="product-top"><div class="product-icon">📦</div><button class="text-btn" onclick="restock('${p.id}')">＋ Stock</button></div><h3>${escapeHTML(p.name)}</h3><div class="sku">SKU ${escapeHTML(p.sku||'—')}</div><div class="product-bottom"><span>${fmt(p.price)} / item</span><span class="${p.stock<10?'stock-low':''}">${p.stock} in stock</span></div></article>`).join(''):'<div class="empty">No products yet. Add your first product.</div>'}function filterProducts(){let q=document.getElementById('prodSearch').value.toLowerCase();document.getElementById('productList').innerHTML=productsCards(data.products.filter(p=>(p.name+' '+p.sku).toLowerCase().includes(q)))}
function expensesPage(){return `<h1 class="section-title">Expenses</h1><p class="section-sub">Record business spending and keep your books in one place.</p><div class="toolbar"><input class="search" id="expSearch" placeholder="Search expenses…" oninput="filterExpenses()"><button class="btn primary" onclick="openExpense()">＋ Add expense</button></div><section class="panel" id="expenseTable">${expenseTable(data.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)))}</section>`}function expenseTable(items){return items.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th><th></th></tr></thead><tbody>${items.map(e=>`<tr><td>${new Date(e.date+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</td><td><strong>${escapeHTML(e.description)}</strong></td><td>${escapeHTML(e.category)}</td><td><strong>${fmt(e.amount)}</strong></td><td><button class="text-btn" onclick="deleteExpense('${e.id}')">Remove</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No expenses recorded yet.</div>'}function filterExpenses(){let q=document.getElementById('expSearch').value.toLowerCase();document.getElementById('expenseTable').innerHTML=expenseTable(data.expenses.filter(e=>(e.description+' '+e.category).toLowerCase().includes(q)))}function deleteExpense(id){if(confirm('Remove this expense from your books?')){data.expenses=data.expenses.filter(e=>e.id!==id);save();render();toast('Expense removed.')}}
function reportsPage(){const inv=monthInvoices(),exp=monthExpenses(),sales=sum(inv,'total'),cogs=inv.reduce((s,i)=>s+i.items.reduce((a,x)=>a+x.cost*x.qty,0),0),expenses=sum(exp,'amount'),tax=sum(inv,'tax');return `<h1 class="section-title">Reports</h1><p class="section-sub">A simple view of sales, costs, and expenses this month.</p><div class="toolbar"><span class="date-chip">${new Date().toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</span><button class="btn" onclick="exportCSV()">↓ Export transactions CSV</button></div><section class="panel"><div class="panel-heading"><div><h2>Monthly summary</h2><p>Based on invoices and expenses recorded in Ledgerleaf</p></div></div><div class="report-cards"><div class="report-tile"><span>Gross sales</span><b>${fmt(sales)}</b></div><div class="report-tile"><span>Cost of goods sold</span><b>${fmt(cogs)}</b></div><div class="report-tile"><span>Operating expenses</span><b>${fmt(expenses)}</b></div></div><div class="table-wrap"><table class="table"><tbody><tr><td>Sales (before tax)</td><td style="text-align:right">${fmt(sales-tax)}</td></tr><tr><td>Tax recorded on invoices</td><td style="text-align:right">${fmt(tax)}</td></tr><tr><td>Cost of goods sold</td><td style="text-align:right">− ${fmt(cogs)}</td></tr><tr><td>Operating expenses</td><td style="text-align:right">− ${fmt(expenses)}</td></tr><tr><td><strong>Estimated net profit</strong></td><td style="text-align:right"><strong>${fmt(sales-cogs-expenses)}</strong></td></tr></tbody></table></div></section><div style="height:14px"></div><div class="notice">This is a management summary based only on entries in this app. It does not include opening balances, unpaid supplier bills, depreciation, or statutory adjustments. Please reconcile it with your accountant’s books before using it for tax or filing decisions.</div>`}
function settingsPage(){return `<h1 class="section-title">Settings</h1><p class="section-sub">Personalise your books and keep a copy of your data.</p><section class="panel"><div class="panel-heading"><div><h2>My businesses</h2><p>Each business has its own products, invoices, expenses, and settings.</p></div><button class="btn primary" onclick="addBusiness()">＋ Add business</button></div><div class="settings-row"><div><b>Active business</b><p>Switch businesses from the selector at the top of the page.</p></div><strong>${escapeHTML(data.business||'Your business')}</strong></div><div class="panel-heading" style="margin-top:22px"><div><h2>Business details</h2><p>Used in your workspace and invoice records</p></div></div><div class="settings-row"><div><b>Business name</b><p>Name shown in your workspace</p></div><input id="businessSetting" value="${escapeHTML(data.business)}" placeholder="Enter business name" onchange="updateSetting('business',this.value)"></div><div class="settings-row"><div><b>Currency</b><p>Currency used for amounts</p></div><select id="currencySetting" onchange="updateSetting('currency',this.value)"><option value="INR" ${data.currency==='INR'?'selected':''}>INR · Indian rupee</option><option value="USD" ${data.currency==='USD'?'selected':''}>USD · US dollar</option><option value="EUR" ${data.currency==='EUR'?'selected':''}>EUR · Euro</option><option value="GBP" ${data.currency==='GBP'?'selected':''}>GBP · Pound sterling</option></select></div><div class="settings-row"><div><b>Default invoice tax rate (%)</b><p>Set to 0 if tax does not apply. Confirm applicable rates with your accountant.</p></div><input type="number" min="0" max="100" id="taxSetting" value="${Number(data.taxRate)||0}" onchange="updateSetting('taxRate',Number(this.value))"></div><div class="settings-row"><div><b>Export backup</b><p>Download your records as a JSON file</p></div><button class="btn" onclick="backup()">↓ Download backup</button></div><div class="settings-row"><div><b>Restore backup</b><p>Load a previously downloaded Ledgerleaf backup file</p></div><label class="btn" for="restoreFile">↑ Choose backup</label><input type="file" id="restoreFile" accept="application/json,.json" style="display:none" onchange="restoreBackup(this)"></div></section><div style="height:14px"></div><div class="notice">Your books are stored in this browser on this device. Clearing browser data can remove them. Download a backup regularly. This first version has no sign-in or cloud sync.</div>`}function updateSetting(k,v){data[k]=v;save();render();toast('Settings saved.')}
function modal(title,body,submitText,submit){document.getElementById('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div><form class="modal-body" id="modalForm">${body}<div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">${submitText}</button></div></form></div></div>`;document.getElementById('modalForm').onsubmit=submit}function closeModal(){document.getElementById('modalRoot').innerHTML=''}function openProduct(){modal('Add a product',`<div class="form-grid"><div class="field full"><label>Product name</label><input name="name" required placeholder="e.g. Ceramic mug"></div><div class="field"><label>SKU (optional)</label><input name="sku" placeholder="e.g. HM-004"></div><div class="field"><label>Selling price (${data.currency})</label><input name="price" type="number" min="0" step="0.01" value="0" required></div><div class="field"><label>Cost per item (${data.currency})</label><input name="cost" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Opening stock</label><input name="stock" type="number" min="0" step="1" value="0"></div></div>`,`Save product`,e=>{e.preventDefault();let f=new FormData(e.target);data.products.push({id:'p'+Date.now(),name:f.get('name'),sku:f.get('sku'),price:+f.get('price'),cost:+f.get('cost'),stock:+f.get('stock')});save();closeModal();render();toast('Product added.')})}function restock(id){const p=data.products.find(x=>x.id===id);const n=prompt(`Add stock for ${p.name}. Enter quantity:`);if(n!==null&&Number(n)>0){p.stock+=Math.floor(Number(n));save();render();toast(`${p.name} stock updated.`)}}function openExpense(){modal('Add an expense',`<div class="form-grid"><div class="field"><label>Date</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Category</label><select name="category" required><option value="" selected disabled>Select a category</option><option>Supplies</option><option>Rent</option><option>Utilities</option><option>Travel</option><option>Marketing</option><option>Other</option></select></div><div class="field full"><label>Description</label><input name="description" required placeholder="What was this expense for?"></div><div class="field"><label>Amount (${data.currency})</label><input name="amount" type="number" min="0" step="0.01" value="0" required></div></div>`,`Save expense`,e=>{e.preventDefault();let f=new FormData(e.target);data.expenses.push({id:'EXP-'+Date.now().toString().slice(-6),date:f.get('date'),category:f.get('category'),description:f.get('description'),amount:+f.get('amount')});save();closeModal();render();toast('Expense recorded.')})}
function openInvoice(){if(!data.products.length){toast('Add a product before creating an invoice.');go('Inventory');return}let options=data.products.map(p=>`<option value="${p.id}">${escapeHTML(p.name)} · ${fmt(p.price)} (${p.stock} available)</option>`).join('');modal('Create an invoice',`<div class="form-grid"><div class="field"><label>Customer</label><input name="customer" list="customerList" required placeholder="Customer name"><datalist id="customerList">${data.customers.map(c=>`<option value="${escapeHTML(c.name)}">`).join('')}</datalist></div><div class="field"><label>Invoice date</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field full"><label>Product</label><select name="productId" required>${options}</select></div><div class="field"><label>Quantity</label><input name="qty" type="number" min="1" value="0" required></div><div class="field"><label>Payment status</label><select name="status"><option>Unpaid</option><option>Paid</option></select></div><div class="field"><label>Tax rate (%)</label><input name="tax" type="number" min="0" max="100" value="${Number(data.taxRate)||0}"></div><div class="field"><label>Notes (optional)</label><input name="notes" placeholder="Add a note"></div><div class="field full"><div class="notice">Invoice total is calculated from the product price, quantity, and tax setting. Stock will update when you save.</div></div></div>`,`Create invoice`,e=>{e.preventDefault();let f=new FormData(e.target),p=data.products.find(x=>x.id===f.get('productId')),qty=+f.get('qty');if(qty>p.stock){toast(`Only ${p.stock} item(s) are available.`);return}let subtotal=p.price*qty,tax=subtotal*(+f.get('tax')||0)/100;let id='INV-'+String(1001+data.invoices.length).padStart(4,'0');data.invoices.push({id,date:f.get('date'),customer:f.get('customer'),items:[{productId:p.id,name:p.name,qty,price:p.price,cost:p.cost}],subtotal,tax,total:subtotal+tax,status:f.get('status'),notes:f.get('notes')});p.stock-=qty;if(!data.customers.some(x=>x.name===f.get('customer')))data.customers.push({name:f.get('customer')});save();closeModal();render();toast(`Invoice ${id} created.`)})}
function exportCSV(){let rows=[['Type','ID','Date','Name / Description','Category','Amount','Status']];data.invoices.forEach(x=>rows.push(['Invoice',x.id,x.date,x.customer,'',x.total,x.status]));data.expenses.forEach(x=>rows.push(['Expense',x.id,x.date,x.description,x.category,x.amount,'Recorded']));let csv=rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='ledgerleaf-transactions.csv';a.click();URL.revokeObjectURL(a.href);toast('Transactions exported.')}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({format:'ledgerleaf-multi-business-v1',businesses,activeBusinessId},null,2)],{type:'application/json'}));a.download='ledgerleaf-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup downloaded.')}function restoreBackup(input){let file=input.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(Array.isArray(d.businesses)&&d.businesses.length){businesses=d.businesses;activeBusinessId=d.activeBusinessId||businesses[0].id;data=businesses.find(b=>b.id===activeBusinessId)||businesses[0];activeBusinessId=data.id}else if(Array.isArray(d.products)&&Array.isArray(d.invoices)&&Array.isArray(d.expenses)){data={...defaults,...d,id:d.id||'business-'+Date.now()};businesses=[data];activeBusinessId=data.id}else throw Error();save();render();toast('Backup restored.')}catch(e){toast('That backup file could not be read.')}};reader.readAsText(file)}save();drawNav();drawBusinessSwitcher();render();
</script></body></html>
